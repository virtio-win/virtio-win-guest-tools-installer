name: Cross-compile qemu-ga for arm64 Windows

# Builds qemu-ga.exe for aarch64-w64-mingw32 on free ubuntu-latest - no native
# ARM64 host needed at all, since this is a genuine cross-compile (unlike
# MSYS2's CLANGARM64 environment, whose clang.exe only runs on real ARM64
# Windows and would need the paid windows-11-arm runner).
#
# Toolchain: llvm-mingw (portable clang/lld cross-compiler, runs on any x86_64
# Linux host). qemu-ga's only real external dependency is glib2; rather than
# build glib2 (and its own dependency chain) from source, this extracts
# MSYS2's prebuilt CLANGARM64 glib2 package and its transitive dependencies -
# just unpacking files, no ARM64 code ever executes on the runner.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'MSI version (e.g. 0.1.0)'
        type: string
        required: false
        default: '0.0.1'
  workflow_call:
    inputs:
      version:
        description: 'MSI version (e.g. 0.1.0)'
        type: string
        required: false
        default: '0.0.1'
  push:
    paths:
      - '.github/workflows/build-qemu-ga-arm64.yml'
      - 'qemu-ga-installer/**'
  pull_request:
    paths:
      - '.github/workflows/build-qemu-ga-arm64.yml'
      - 'qemu-ga-installer/**'

env:
  LLVM_MINGW_VERSION: '20260616'
  QEMU_REF: 'master'
  SYSROOT: ${{ github.workspace }}/sysroot

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install build tools
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y ninja-build python3-pip zstd binutils-mingw-w64-x86-64 mingw-w64-tools
          pip install --user meson
          # qga/meson.build unconditionally requires 'windmc' (or 'mc') to
          # compile Windows Event Log message-table resources - it's pure
          # text/binary table generation, not machine code, so it isn't
          # actually architecture-specific despite the x86_64 prefix.
          # llvm-mingw doesn't ship an equivalent at all. First attempt
          # symlinked a bare 'windmc', which failed - under cross-compile,
          # meson's find_program auto-prefixes the search with the cross
          # prefix (error was literally "aarch64-w64-mingw32-windmc not
          # found"), so that's the name it actually needs on PATH.
          sudo ln -s /usr/bin/x86_64-w64-mingw32-windmc /usr/local/bin/aarch64-w64-mingw32-windmc
          sudo ln -s /usr/bin/x86_64-w64-mingw32-windmc /usr/local/bin/windmc
          # Same story for widl (qga/vss-win32/meson.build needs it to
          # compile qga-vss.idl into a type library) - it's IDL/COM
          # metadata generation, not machine code, so architecture-agnostic
          # despite the x86_64 prefix. mingw-w64-tools ships it.
          sudo ln -s /usr/bin/x86_64-w64-mingw32-widl /usr/local/bin/aarch64-w64-mingw32-widl
          sudo ln -s /usr/bin/x86_64-w64-mingw32-widl /usr/local/bin/widl

      - name: Fetch llvm-mingw
        run: |
          set -e
          curl -fsSL -o llvm-mingw.tar.xz \
            "https://github.com/mstorsjo/llvm-mingw/releases/download/${LLVM_MINGW_VERSION}/llvm-mingw-${LLVM_MINGW_VERSION}-ucrt-ubuntu-22.04-x86_64.tar.xz"
          mkdir -p "$HOME/llvm-mingw"
          tar -xJf llvm-mingw.tar.xz -C "$HOME/llvm-mingw" --strip-components=1
          echo "$HOME/llvm-mingw/bin" >> "$GITHUB_PATH"

      - name: Resolve and fetch glib2's arm64 dependency closure from MSYS2
        run: |
          set -e
          mkdir -p msys2db && cd msys2db
          curl -fsSL -o clangarm64.db "https://mirror.msys2.org/mingw/clangarm64/clangarm64.db"
          tar -I zstd -xf clangarm64.db

          cat > resolve.py << 'PYEOF'
          import os, re, sys

          PREFIX = "mingw-w64-clang-aarch64-"
          # python/python-packaging are only needed for glib2's dev-tool scripts
          # (gdbus-codegen etc.), not for compiling/linking against the library.
          SKIP = {PREFIX + "python", PREFIX + "python-packaging"}

          def parse_desc(pkgdir):
              with open(os.path.join(pkgdir, "desc")) as f:
                  content = f.read()
              fields = {}
              parts = re.split(r'%([A-Z]+)%\n', content)[1:]
              for i in range(0, len(parts), 2):
                  fields[parts[i]] = [l for l in parts[i + 1].strip().split('\n') if l]
              return fields

          name_to_dir = {}
          for d in os.listdir('.'):
              if not os.path.isdir(d):
                  continue
              fields = parse_desc(d)
              for n in fields.get('NAME', []):
                  name_to_dir[n] = d

          def strip_version(dep):
              return re.split(r'[<>=]', dep)[0]

          resolved = set()

          def resolve(pkgname):
              if pkgname in resolved or pkgname in SKIP:
                  return
              if pkgname not in name_to_dir:
                  print(f"WARN: {pkgname} not found in db", file=sys.stderr)
                  return
              resolved.add(pkgname)
              fields = parse_desc(name_to_dir[pkgname])
              for dep in fields.get('DEPENDS', []):
                  dn = strip_version(dep)
                  if dn.startswith(PREFIX):
                      resolve(dn)

          resolve(PREFIX + "glib2")

          for n in sorted(resolved):
              fields = parse_desc(name_to_dir[n])
              print(fields['FILENAME'][0])
          PYEOF
          python3 resolve.py > ../packages.txt
          cat ../packages.txt
          cd ..

          # Extract into a user-owned dir rather than straight to / - some
          # packages also ship files outside clangarm64/ (e.g. licenses under
          # usr/share/...), which need root to write at real /. A single
          # symlink at the end gets /clangarm64 pointing at the right place
          # (matching what these packages' .pc files hardcode as their
          # prefix=) without needing root for the extraction itself.
          mkdir -p "$HOME/msys2root"
          while read -r pkg; do
            curl -fsSL -o "/tmp/$pkg" "https://mirror.msys2.org/mingw/clangarm64/$pkg"
            tar -I zstd -xf "/tmp/$pkg" -C "$HOME/msys2root" clangarm64/
          done < packages.txt
          sudo ln -s "$HOME/msys2root/clangarm64" /clangarm64
          test -f /clangarm64/lib/pkgconfig/glib-2.0.pc || { echo "glib-2.0.pc missing after extraction"; exit 1; }

      - name: Fetch QEMU source
        run: |
          set -e
          git clone --depth 1 --branch "${{ env.QEMU_REF }}" https://gitlab.com/qemu-project/qemu.git

      - name: Configure (guest-agent only)
        working-directory: qemu
        env:
          # configure defaults PKG_CONFIG to "${cross_prefix}pkg-config"
          # (aarch64-w64-mingw32-pkg-config), which llvm-mingw doesn't ship -
          # use the bare system pkg-config, scoped to the extracted MSYS2
          # packages via PKG_CONFIG_LIBDIR/SYSROOT_DIR instead.
          PKG_CONFIG: pkg-config
          PKG_CONFIG_LIBDIR: /clangarm64/lib/pkgconfig
          PKG_CONFIG_SYSROOT_DIR: /clangarm64
        run: |
          set -e
          export PATH="$HOME/.local/bin:$PATH"
          # --cross-prefix builds its own internal meson cross-file from the
          # detected aarch64-w64-mingw32-* tools; no separate --cross-file
          # needed. --meson= isn't accepted by current configure - it always
          # bootstraps its own meson into a venv.
          #
          # guest_agent defaults to the 'auto' feature type, which top-level
          # meson.build disables via disable_auto_if(not have_system and not
          # have_tools) - since both are disabled here, 'auto' silently
          # skipped it with no error at all (that's how meson 'auto' features
          # behave: silent skip, not a failure). Force it on explicitly so
          # any real problem fails loudly instead.
          # qga_vss: needs a C++ cross-compiler (llvm-mingw provides
          # aarch64-w64-mingw32-g++), the VSS SDK headers (present in
          # llvm-mingw's bundled mingw-w64 headers - checked directly:
          # vss.h, vswriter.h, vsbackup.h all exist) and midl or widl
          # (provided above). Force 'enabled' rather than leave 'auto', same
          # reasoning as guest_agent: auto silently skips on any unmet
          # requirement instead of erroring, which would hide a real
          # problem instead of surfacing it.
          ./configure \
            --cross-prefix=aarch64-w64-mingw32- \
            --disable-system \
            --disable-user \
            --disable-tools \
            --disable-docs \
            --disable-guest-agent-msi \
            -Dguest_agent=enabled \
            -Dqga_vss=enabled

      - name: Build qemu-ga.exe
        working-directory: qemu
        run: |
          set -e
          # 'qga/qemu-ga.exe' wasn't the right ninja target name - rather than
          # guess again, build everything configure left enabled (small,
          # since system/user/tools/docs are all disabled) and locate the
          # actual output afterward instead of pre-guessing meson's naming.
          ninja -C build
          find build -iname 'qemu-ga.exe'
          find build -iname 'qemu-ga.exe' -exec cp {} qemu-ga.exe \;
          file qemu-ga.exe
          # qga-vss.dll built as part of the default set, but qga-vss.tlb
          # (the gen-tlb custom_target) apparently isn't wired into it -
          # request it explicitly by its declared output path.
          ninja -C build qga/vss-win32/qga-vss.tlb
          find build -iname 'qga-vss.dll' -o -iname 'qga-vss.tlb'
          find build -iname 'qga-vss.dll' -exec cp {} qga-vss.dll \;
          find build -iname 'qga-vss.tlb' -exec cp {} qga-vss.tlb \;
          file qga-vss.dll
          # Don't yet know qga-vss.dll's own runtime DLL closure (clang's
          # C++ runtime for mingw targets may differ from qemu-ga.exe's,
          # which is plain C) - dump its imports so the next step can be
          # based on what's actually there instead of another guess.
          strings qga-vss.dll | grep -i '\.dll$' | sort -u

      - name: Collect runtime DLLs
        run: |
          set -e
          # qemu-ga.exe's own import table (checked via strings, since
          # Debian's objdump doesn't recognize PE-ARM64 at all) only shows
          # libglib-2.0-0.dll as an external dependency beyond OS-provided
          # DLLs (kernel32/advapi32/etc.) and the api-ms-win-crt-* UCRT
          # forwarders, which Windows 10+ ships natively - no GCC-style
          # libgcc/libwinpthread/libssp runtime needed at all, unlike
          # QEMU's own GCC-mingw-oriented qga/installer/qemu-ga.wxs
          # template. glib2 itself is dynamically linked against pcre2,
          # zlib, libffi and iconv/gettext though (its declared MSYS2
          # package deps), so bundle those too since a missing one would
          # only surface as a runtime failure on the actual guest, not a
          # build-time error here.
          mkdir -p package
          cp qemu/qemu-ga.exe package/
          cp qemu/qga-vss.dll package/
          cp qemu/qga-vss.tlb package/
          # qga-vss.dll's own imports (checked via strings, since Debian's
          # objdump doesn't recognize PE-ARM64): everything else it needs
          # is Windows-provided (VSSAPI.DLL ships with Windows itself, plus
          # the usual ADVAPI32/OLE32/OLEAUT32/SHLWAPI/USER32 system DLLs),
          # except libc++.dll and libunwind.dll - clang/llvm-mingw's C++
          # runtime, not part of Windows. qemu-ga.exe itself is plain C so
          # it never needed these; qga-vss.dll is C++.
          cp "$HOME/llvm-mingw/aarch64-w64-mingw32/bin/libc++.dll" package/
          cp "$HOME/llvm-mingw/aarch64-w64-mingw32/bin/libunwind.dll" package/
          for dll in \
            libglib-2.0-0.dll \
            libpcre2-8-0.dll \
            zlib1.dll \
            libffi-8.dll \
            libintl-8.dll \
            libiconv-2.dll \
            libcharset-1.dll \
          ; do
            cp "/clangarm64/bin/$dll" package/
          done
          # g_spawn_* (used for qemu-ga's guest-exec command) shells out via
          # these helper binaries rather than CreateProcess directly.
          cp /clangarm64/bin/gspawn-win64-helper.exe package/
          cp /clangarm64/bin/gspawn-win64-helper-console.exe package/
          ls -la package/

      - uses: actions/upload-artifact@v4
        with:
          name: qemu-ga-arm64-bin
          path: package/
          if-no-files-found: error

  package-msi:
    needs: build
    runs-on: windows-latest
    env:
      WIX_DIR: ${{ github.workspace }}\wix314
      QEMU_GA_VERSION: ${{ inputs.version || '0.0.1' }}
      QEMU_GA_MANUFACTURER: 'Red Hat, Inc.'
      QEMU_GA_DISTRO: 'Fedora'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: qemu-ga-arm64-bin
          path: bin

      - name: Fetch portable WiX Toolset binaries
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Invoke-WebRequest `
            -Uri "https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip" `
            -OutFile "$env:RUNNER_TEMP\wix314-binaries.zip"
          Expand-Archive -Path "$env:RUNNER_TEMP\wix314-binaries.zip" -DestinationPath "${{ env.WIX_DIR }}"

      - name: Compile and link qemu-ga-arm64.msi
        working-directory: qemu-ga-installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & "${{ env.WIX_DIR }}\candle.exe" `
            qemu-ga-arm64.wxs `
            -out qemu-ga-arm64.wixobj `
            -nologo -pedantic -v -arch arm64 `
            -dBIN_DIR="${{ github.workspace }}\bin" `
            -dQEMU_GA_VERSION="${{ env.QEMU_GA_VERSION }}" `
            -dQEMU_GA_MANUFACTURER="${{ env.QEMU_GA_MANUFACTURER }}" `
            -dQEMU_GA_DISTRO="${{ env.QEMU_GA_DISTRO }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "${{ env.WIX_DIR }}\light.exe" `
            qemu-ga-arm64.wixobj `
            -out qemu-ga-arm64.msi `
            -nologo -pedantic -v `
            -sval `
            -cultures:en-us
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: qemu-ga-arm64-msi
          path: qemu-ga-installer/qemu-ga-arm64.msi
          if-no-files-found: error
