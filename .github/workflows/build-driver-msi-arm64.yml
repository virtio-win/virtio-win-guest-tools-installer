name: Build virtio-win-gt-arm64.msi

# End-to-end test of the arm64 WiX driver installer path, running natively on
# windows-latest - no Wine needed at all, unlike the Linux Makefile, since
# candle.exe/light.exe are ordinary Windows tools. Driver source content comes
# from qemus/virtiso-arm's GitHub Release tarball (a stripped-down repack of
# the official Fedora virtio-win ISO, ARM64-only) rather than the official
# fedorapeople.org mirror, which is behind Anubis anti-bot protection and
# blocks scripted fetches. Requires Libraries/arm64/* to already be committed
# (see build-drvinst-arm64.yml).
#
# pvpanic isn't in that driver content tarball at all (no accessible source
# has it - see build-pvpanic-arm64.yml for what was checked). It's excluded
# by default here, same as fwcfg/qemupciserial/viofs which have no arm64
# driver support upstream at all - unlike those three, pvpanic does have
# real upstream arm64 project support, it's purely that no signed binary is
# published yet. Set include_pvpanic to build it from source and slot it
# into the same directory layout the fetched content already uses - it's a
# self-signed test build, not WHQL-certified, and is for local testing only
# (see build-pvpanic-arm64.yml for the testsigning requirement this implies
# for whoever installs the resulting MSI). This is deliberately not the
# default so a plain arm64 build - and what a reviewer sees in a diff -
# doesn't ship an unsigned driver.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'MSI version (e.g. 0.1.0)'
        type: string
        required: false
        default: '0.0.1'
      include_pvpanic:
        description: 'Build a self-signed, test-only pvpanic driver from source and include it (not for real releases)'
        type: boolean
        required: false
        default: false
  workflow_call:
    inputs:
      version:
        description: 'MSI version (e.g. 0.1.0)'
        type: string
        required: false
        default: '0.0.1'
      include_pvpanic:
        description: 'Build a self-signed, test-only pvpanic driver from source and include it (not for real releases)'
        type: boolean
        required: false
        default: false
  push:
    paths:
      - 'virtio-win-drivers-installer/**'
      - 'Libraries/arm64/**'
      - '.github/workflows/build-driver-msi-arm64.yml'
  pull_request:
    paths:
      - 'virtio-win-drivers-installer/**'
      - 'Libraries/arm64/**'
      - '.github/workflows/build-driver-msi-arm64.yml'

env:
  WIX_VERSION: '3.14.1'
  WIX_DIR: ${{ github.workspace }}\wix314
  DRIVERS_DIR: ${{ github.workspace }}\virtio-win-arm64-drivers
  INSTALLER_DIR: ${{ github.workspace }}\virtio-win-drivers-installer
  MSI_VERSION: ${{ inputs.version || '0.0.1' }}

jobs:
  pvpanic:
    if: inputs.include_pvpanic
    uses: ./.github/workflows/build-pvpanic-arm64.yml

  build:
    needs: pvpanic
    # pvpanic is skipped entirely (not failed) when include_pvpanic is false - a
    # skipped dependency still needs an explicit pass-through here, or the default
    # implicit success() check would skip this job too.
    if: always() && (needs.pvpanic.result == 'success' || needs.pvpanic.result == 'skipped')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download self-built pvpanic (w10)
        if: inputs.include_pvpanic
        uses: actions/download-artifact@v4
        with:
          name: pvpanic-arm64-w10
          path: pvpanic-w10

      - name: Download self-built pvpanic (w11)
        if: inputs.include_pvpanic
        uses: actions/download-artifact@v4
        with:
          name: pvpanic-arm64-w11
          path: pvpanic-w11

      - name: Fetch portable WiX Toolset ${{ env.WIX_VERSION }} binaries
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Invoke-WebRequest `
            -Uri "https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip" `
            -OutFile "$env:RUNNER_TEMP\wix314-binaries.zip"
          Expand-Archive -Path "$env:RUNNER_TEMP\wix314-binaries.zip" -DestinationPath "${{ env.WIX_DIR }}"

      - name: Fetch arm64 virtio-win driver content
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # fedorapeople.org (the official mirror) is behind Anubis anti-bot
          # protection and blocks scripted fetches - use qemus/virtiso-arm's
          # GitHub Release instead, a repack of the same official driver tree
          # stripped to arm64 only.
          Invoke-WebRequest `
            -Uri "https://github.com/qemus/virtiso-arm/releases/download/v0.1.285-1/virtio-win-0.1.285.tar.xz" `
            -OutFile "$env:RUNNER_TEMP\virtio-win-arm64.tar.xz"
          New-Item -ItemType Directory -Force -Path "${{ env.DRIVERS_DIR }}" | Out-Null
          tar -xf "$env:RUNNER_TEMP\virtio-win-arm64.tar.xz" -C "${{ env.DRIVERS_DIR }}"
          Get-ChildItem "${{ env.DRIVERS_DIR }}"

      - name: Place self-built pvpanic into the driver content tree
        if: inputs.include_pvpanic
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # This qemus/virtiso-arm release has no arm64 pvpanic files at all
          # (checked every accessible source - see the pvpanic build
          # workflow for what was tried). Built it ourselves instead
          # (build-pvpanic-arm64.yml) and place it into the same
          # <driver>\<osShort>\ARM64\ layout the fetched driver content
          # already uses, so it's indistinguishable to the WiX packaging
          # from a real upstream driver source.
          foreach ($os in "w10", "w11") {
            $dest = Join-Path "${{ env.DRIVERS_DIR }}" "pvpanic\$os\ARM64"
            New-Item -ItemType Directory -Force -Path $dest | Out-Null
            Copy-Item "pvpanic-$os\pvpanic.inf" $dest
            Copy-Item "pvpanic-$os\pvpanic.cat" $dest
            Copy-Item "pvpanic-$os\pvpanic.sys" $dest
          }
          Get-ChildItem -Recurse "${{ env.DRIVERS_DIR }}\pvpanic"

      - name: Generate constants.wxi
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          (Get-Content "${{ env.INSTALLER_DIR }}\constants.wxi.in") `
            -replace '@@VERSION@@', "${{ env.MSI_VERSION }}" `
            -replace '@@VIRTIO-WIN-PATH@@', "${{ env.DRIVERS_DIR }}" |
            Set-Content "${{ env.INSTALLER_DIR }}\constants.wxi"

      - name: Compile (candle.exe, arch arm64)
        shell: pwsh
        working-directory: virtio-win-drivers-installer
        run: |
          $ErrorActionPreference = "Stop"
          $wxsFiles = @(
            "*.wxs",
            "Drivers\Balloon\*.wxs",
            "Drivers\NetKVM\*.wxs",
            "Drivers\vioinput\*.wxs",
            "Drivers\viorng\*.wxs",
            "Drivers\vioscsi\*.wxs",
            "Drivers\vioserial\*.wxs",
            "Drivers\viostor\*.wxs",
            "Drivers\viogpudo\*.wxs",
            "Drivers\viomem\*.wxs"
          )
          $defines = @()
          if ("${{ inputs.include_pvpanic }}" -eq "true") {
            $wxsFiles += "Drivers\pvpanic\*.wxs"
            $defines += "-dINCLUDE_SELF_SIGNED_PVPANIC_ARM64=1"
          }
          & "${{ env.WIX_DIR }}\candle.exe" `
            @wxsFiles `
            -out wixobjarm64\ `
            -nologo -pedantic -v -arch arm64 -fips `
            -ext "${{ env.WIX_DIR }}\WixUtilExtension.dll" `
            -ext "${{ env.WIX_DIR }}\WixUIExtension.dll" `
            -ext "${{ github.workspace }}\Libraries\arm64\DrvInstExt.dll" `
            @defines
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Link (light.exe)
        shell: pwsh
        working-directory: virtio-win-drivers-installer
        run: |
          $ErrorActionPreference = "Stop"
          & "${{ env.WIX_DIR }}\light.exe" `
            "wixobjarm64\*.wixobj" `
            -out virtio-win-gt-arm64.msi `
            -nologo -pedantic -v `
            -ext "${{ env.WIX_DIR }}\WixUtilExtension.dll" `
            -ext "${{ env.WIX_DIR }}\WixUIExtension.dll" `
            -ext "${{ github.workspace }}\Libraries\arm64\DrvInstExt.dll" `
            -cultures:en-us
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Stage pvpanic test-signing certs alongside the MSI
        if: inputs.include_pvpanic
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # Whoever installs this MSI needs these to trust pvpanic.sys's
          # signature (on top of enabling testsigning mode) - without them
          # the pvpanic component specifically will fail to load even
          # though the rest of the MSI installs fine.
          Copy-Item pvpanic-w10\pvpanic-test-cert-w10.cer virtio-win-drivers-installer\
          Copy-Item pvpanic-w11\pvpanic-test-cert-w11.cer virtio-win-drivers-installer\

      - uses: actions/upload-artifact@v4
        with:
          name: virtio-win-gt-arm64-msi
          # The cert glob only matches anything when include_pvpanic staged them
          # above - ignore is safe here since a genuinely missing MSI would already
          # have failed the build at the light.exe step, not silently skipped here.
          path: |
            virtio-win-drivers-installer/virtio-win-gt-arm64.msi
            virtio-win-drivers-installer/pvpanic-test-cert-*.cer
          if-no-files-found: ignore
